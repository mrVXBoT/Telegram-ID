[pytest]
# Asyncio test runner configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Test discovery paths and python import root
testpaths = tests
pythonpath = .

# Default command line options: summary report, quiet, strict markers
addopts = -ra -q --strict-markers

# Custom test markers
markers =
    unit: marks unit tests (fast, isolated)
    database: marks SQLite repository and migration tests
    services: marks Telethon session manager and service tests
    bot: marks python-telegram-bot handler tests
    integration: marks multi-component integration workflows
    slow: marks long-running tests
